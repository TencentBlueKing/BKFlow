specVersion: 3
appVersion: "1.12.0"
app:
  region: default
  bkAppCode: bk_flow_engine
  bkAppName: 蓝鲸流程引擎服务
  bkAppNameEn: BKFlow
  market:
    category: 运维工具
    introduction: 流程引擎服务
    introductionEn: Process Engine Service
    description: 为上层应用提供快捷接入流程引擎服务能力
    descriptionEn: Provide upper-level applications with quick access to process engine service capabilities
    displayOptions:
      width: 1280
      height: 720
      openMode: new_tab
      isMaximized: true
modules:
  - name: default
    isDefault: true
    sourceDir: ./src
    language: Python
    spec:
      addons:
        - name: mysql
        - name: rabbitmq
      configuration:
        env:
          - name: PIP_VERSION
            value: 23.0.1
            description: pip版本
          - name: BKFLOW_MODULE_TYPE
            value: interface
            description: 模块类型
          - name: GUNICORN_WORKER_NUM
            value: '1'
            description: GunicornWorker数量
          - name: GUNICORN_THREAD_NUM
            value: '10'
            description: GunicornThread数量
          - name: APP_INTERNAL_TOKEN
            value: df1da1fc5b134858b0743838d7db256b
            description: 应用模块内部调用token
          - name: DEFAULT_ENGINE_APP_INTERNAL_TOKEN
            value: a35230d7a282485dba66a867e07d8125
            description: default-engine模块内部调用token
          - name: BK_APIGW_NETLOC_PATTERN
            value: ^bkapi.{hostname}
            description: 用于识别请求地址是否来自 APIGW
          - name: BKAPP_USE_PLUGIN_SERVICE
            value: '1'
            description: 是否使用插件服务
          - name: BKFLOW_DEFAULT_CALLBACK_KEY
            value: jbSH1_3PFsM8WRZZpUXJPhlJuvuA44A7Ov0nPhFk5ZY=
            description: 默认回调KEY
      processes:
        - name: web
          procCommand: bin/start_web.sh
          resQuotaPlan: 4C2G
          replicas: 2
          services:
            - name: web
              protocol: TCP
              exposedType:
                name: bk/http
              targetPort: 5000
              port: 80
        - name: beat
          procCommand: celery -A blueapps.core.celery beat -l info
          resQuotaPlan: 4C1G
          replicas: 1
        - name: worker
          procCommand: celery -A blueapps.core.celery worker -n interface_worker@%h -P threads -c 100 -l info
          resQuotaPlan: 4C2G
          replicas: 2
      hooks:
        preRelease:
          procCommand: bin/pre_release.sh
      svcDiscovery:
        bkSaaS:
          - bkAppCode: bk-user
          - bkAppCode: bk_flow_engine
          - bkAppCode: bk_flow_engine
            moduleName: default-engine
  - name: default-engine
    isDefault: false
    sourceDir: ./src
    language: Python
    spec:
      addons:
        - name: mysql
        - name: rabbitmq
        - name: redis
      configuration:
        env:
          - name: BKFLOW_MODULE_TYPE
            value: engine
            description: 模块类型
          - name: BKFLOW_MODULE_CODE
            value: default
            description: 空间编码
          - name: GUNICORN_WORKER_NUM
            value: '2'
            description: GunicornWorker数量
          - name: GUNICORN_THREAD_NUM
            value: '10'
            description: GunicornThread数量
          - name: INTERFACE_APP_INTERNAL_TOKEN
            value: df1da1fc5b134858b0743838d7db256b
            description: Interface模块内部调用token
          - name: PIP_VERSION
            value: 23.0.1
            description: pip版本
          - name: BK_APIGW_NETLOC_PATTERN
            value: ^bkapi.{hostname}
            description: 用于识别请求地址是否来自 APIGW
          - name: BKAPP_USE_PLUGIN_SERVICE
            value: '1'
            description: 是否使用插件服务
          - name: BKFLOW_DEFAULT_CALLBACK_KEY
            value: jbSH1_3PFsM8WRZZpUXJPhlJuvuA44A7Ov0nPhFk5ZY=
            description: 默认回调KEY
          - name: APP_INTERNAL_TOKEN
            value: a35230d7a282485dba66a867e07d8125
            description: 应用模块内部调用token
      processes:
        - name: er-e
          procCommand: celery -A blueapps.core.celery worker -P threads -Q er_execute_${BKFLOW_MODULE_CODE} -n er_e_worker@%h -c 100 -l info
          resQuotaPlan: 4C4G
          replicas: 2
        - name: er-s
          procCommand: celery -A blueapps.core.celery worker -P threads -Q er_schedule_${BKFLOW_MODULE_CODE} -n er_s_worker@%h -c 100 -l info
          resQuotaPlan: 4C4G
          replicas: 2
        - name: cworker
          procCommand: celery -A blueapps.core.celery worker -P threads -Q celery,pipeline_additional_task,pipeline_additional_task_priority,task_common_${BKFLOW_MODULE_CODE},task_callback_${BKFLOW_MODULE_CODE},node_auto_retry_${BKFLOW_MODULE_CODE},timeout_node_execute_${BKFLOW_MODULE_CODE},timeout_node_record_${BKFLOW_MODULE_CODE} -n common_worker@%h -c 10 -l info
          resQuotaPlan: 4C1G
          replicas: 2
        - name: timeout
          procCommand: python manage.py node_timeout_process
          resQuotaPlan: 4C1G
          replicas: 1
        - name: web
          procCommand: bin/start_web.sh
          resQuotaPlan: 4C2G
          replicas: 2
          services:
            - name: web
              protocol: TCP
              exposedType:
                name: bk/http
              targetPort: 5000
              port: 80
        - name: beat
          procCommand: celery -A blueapps.core.celery beat -l info
          resQuotaPlan: 4C1G
          replicas: 1
        - name: clean-worker
          procCommand: celery -A blueapps.core.celery worker -P threads -Q clean_task_${BKFLOW_MODULE_CODE} -n clean_worker@%h -c 100 -l info
          resQuotaPlan: 4C4G
          replicas: 1
      hooks:
        preRelease:
          procCommand: bin/pre_release.sh
      svcDiscovery:
        bkSaaS:
          - bkAppCode: bk_flow_engine
