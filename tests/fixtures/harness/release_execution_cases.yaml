schema_version: 1

trusted_context: &trusted_context
  platform_key: bkaidev
  platform_app: trusted-app
  actor: dannydeng
  space_id: 905
  scope_type: project
  scope_value: "905"
  target_environment: stag
  policy_version: risk-2026.09
  mcp_contract_version: 1.3.0

predecessor: &predecessor
  relation: latest
  sequence: 1
  validation: passed

fingerprint: &fingerprint
  relation: exact
  algorithm: sha256

policy: &policy
  profile: risk-2026.09
  publish_enabled: true
  execution_enabled: true
  global_real_enabled: false

forbidden: &forbidden
  - P3_GOLDEN_SECRET_SENTINEL
  - Bearer p3-golden-secret
  - approval://provider/raw-secret

defaults: &defaults
  trusted_context: *trusted_context
  predecessor_revision: *predecessor
  draft_fingerprint: *fingerprint
  policy: *policy
  approval: {mode: none, action: none}
  engine_sequence: []
  expected:
    envelope_code: OK
    run_status: unchanged
    execution_status: none
    evidence_events: []
    token_lease_result: none
    mutations: {publish: 0, create: 0, start: 0, control: 0, read: 0}
  forbidden_markers: *forbidden

